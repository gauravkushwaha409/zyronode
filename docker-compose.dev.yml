# docker-compose.yml
services:
  postgres:
    image: postgres:17.4
    container_name: zyro-chat-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGPORT=5433
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: zyro-chat-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6380"]
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 60s
      timeout: 60s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: zyro-chat-server
    command: sh -c "pnpm prisma:generate && pnpm prisma:deploy && pnpm dev:server"
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.SERVER_PORT || '8000') + '/api/v1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 60s
      timeout: 60s
      retries: 10
      start_period: 30s
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5433/mydb
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - S3_ENDPOINT=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile.dev
    container_name: zyro-chat-app
    command: sh -c "pnpm dev:app"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env for Docker networking; change PROXY in .env to toggle single source of truth.
      - PROXY=${PROXY:-true}
      - APP_PORT=${APP_PORT:-3000}
      - SERVER_PORT=${SERVER_PORT:-8000}
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./apps/app/src:/app/apps/app/src
      - ./packages/api-client/src:/app/packages/api-client/src
      - ./packages/form/src:/app/packages/form/src
      - ./packages/hooks/src:/app/packages/hooks/src
      - ./packages/icons/src:/app/packages/icons/src
      - ./packages/query/src:/app/packages/query/src
      - ./packages/sse/src:/app/packages/sse/src
      - ./packages/text-editor/src:/app/packages/text-editor/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/websocket/src:/app/packages/websocket/src
      - ./packages/typescript-config:/app/packages/typescript-config

  chat-widget-test:
    build:
      context: .
      dockerfile: apps/chat-widget-test/Dockerfile.dev
    container_name: zyro-chat-widget-test
    command: sh -c "pnpm dev:chat-widget"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CHAT_WIDGET_PORT=${CHAT_WIDGET_PORT:-4000}
      - SERVER_PORT=${SERVER_PORT:-8000}
    ports:
      - "${CHAT_WIDGET_PORT:-4000}:${CHAT_WIDGET_PORT:-4000}"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./apps/chat-widget-test/src:/app/apps/chat-widget-test/src
      - ./packages/chat-widget/src:/app/packages/chat-widget/src
      - ./packages/api-client/src:/app/packages/api-client/src
      - ./packages/icons/src:/app/packages/icons/src
      - ./packages/query/src:/app/packages/query/src
      - ./packages/sse/src:/app/packages/sse/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/websocket/src:/app/packages/websocket/src
      - ./packages/typescript-config:/app/packages/typescript-config

  localstack:
    container_name: zyro-chat-localstack
    image: localstack/localstack
    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      - '127.0.0.1:4510-4559:4510-4559' # external services port range
      - '127.0.0.1:443:443' # LocalStack HTTPS Gateway
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'

      
volumes:
  postgres_data:
  redis_data: