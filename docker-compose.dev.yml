# docker-compose.yml
services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: server
    command: sh -c "pnpm prisma:generate && pnpm prisma:deploy && pnpm dev:server"
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/api/v1').then((r) => process.exit(0)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/mydb
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile.dev
    container_name: app
    command: sh -c "pnpm dev:app"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env for Docker networking; change PROXY in .env to toggle single source of truth.
      - VITE_SERVER_URL=${VITE_SERVER_URL:-http://server:8000}
      - PROXY=${PROXY:-true}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./apps/app/src:/app/apps/app/src
      - ./packages/api-client/src:/app/packages/api-client/src
      - ./packages/form/src:/app/packages/form/src
      - ./packages/hooks/src:/app/packages/hooks/src
      - ./packages/icons/src:/app/packages/icons/src
      - ./packages/query/src:/app/packages/query/src
      - ./packages/sse/src:/app/packages/sse/src
      - ./packages/text-editor/src:/app/packages/text-editor/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/websocket/src:/app/packages/websocket/src
      - ./packages/typescript-config:/app/packages/typescript-config

volumes:
  postgres_data:
  redis_data: