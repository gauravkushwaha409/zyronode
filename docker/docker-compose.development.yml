# Development stack. Run via `pnpm docker:development:*` (passes --env-file env/.env.development).
# Paths are relative to this file (docker/).
name: zyronode

services:
  postgres:
    image: postgres:17.4
    container_name: zyronode-postgres
    restart: unless-stopped
    env_file:
      - ../env/.env.development
    environment:
      - PGPORT=${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.development}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.development}:${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.development}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb -p ${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.development}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: zyronode-redis
    restart: unless-stopped
    command: ["redis-server", "--port", "6380"]
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 60s
      timeout: 60s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: apps/server/docker/Dockerfile.development
    container_name: zyronode-server
    command: sh -c "pnpm prisma:generate && pnpm prisma:deploy && pnpm dev:server"
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:?SERVER_PORT must be set in env/.env.development}:${SERVER_PORT:?SERVER_PORT must be set in env/.env.development}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.SERVER_PORT || '8000') + '/api/v1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 60s
      timeout: 60s
      retries: 10
      start_period: 30s
    volumes:
      - ../apps/server/src:/app/apps/server/src
      - ../apps/server/prisma:/app/apps/server/prisma
    env_file:
      - ../env/.env.development
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set in env/.env.development}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in env/.env.development}@postgres:${POSTGRES_PORT:?POSTGRES_PORT must be set in env/.env.development}/${POSTGRES_DB:?POSTGRES_DB must be set in env/.env.development}
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - S3_ENDPOINT=http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: apps/app/docker/Dockerfile.development
    container_name: zyronode-app
    command: sh -c "pnpm dev:app"
    restart: unless-stopped
    env_file:
      - ../env/.env.development
    environment:
      # Overrides env/.env.development for Docker networking; change PROXY there to toggle single source of truth.
      - PROXY=${PROXY:-true}
      - APP_PORT=${APP_PORT:?APP_PORT must be set in env/.env.development}
      - SERVER_PORT=${SERVER_PORT:?SERVER_PORT must be set in env/.env.development}
    ports:
      - "${APP_PORT:?APP_PORT must be set in env/.env.development}:${APP_PORT:?APP_PORT must be set in env/.env.development}"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ../apps/app/src:/app/apps/app/src
      - ../packages/api-client/src:/app/packages/api-client/src
      - ../packages/form/src:/app/packages/form/src
      - ../packages/hooks/src:/app/packages/hooks/src
      - ../packages/icons/src:/app/packages/icons/src
      - ../packages/query/src:/app/packages/query/src
      - ../packages/sse/src:/app/packages/sse/src
      - ../packages/text-editor/src:/app/packages/text-editor/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/websocket/src:/app/packages/websocket/src
      - ../packages/typescript-config:/app/packages/typescript-config

  chat-widget-test:
    build:
      context: ..
      dockerfile: apps/chat-widget-test/docker/Dockerfile.development
    container_name: zyronode-widget-test
    command: sh -c "pnpm dev:chat-widget"
    restart: unless-stopped
    env_file:
      - ../env/.env.development
    environment:
      - CHAT_WIDGET_PORT=${CHAT_WIDGET_PORT:?CHAT_WIDGET_PORT must be set in env/.env.development}
      - SERVER_PORT=${SERVER_PORT:?SERVER_PORT must be set in env/.env.development}
    ports:
      - "${CHAT_WIDGET_PORT:?CHAT_WIDGET_PORT must be set in env/.env.development}:${CHAT_WIDGET_PORT:?CHAT_WIDGET_PORT must be set in env/.env.development}"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ../apps/chat-widget-test/src:/app/apps/chat-widget-test/src
      - ../packages/chat-widget/src:/app/packages/chat-widget/src
      - ../packages/api-client/src:/app/packages/api-client/src
      - ../packages/icons/src:/app/packages/icons/src
      - ../packages/query/src:/app/packages/query/src
      - ../packages/sse/src:/app/packages/sse/src
      - ../packages/ui/src:/app/packages/ui/src
      - ../packages/websocket/src:/app/packages/websocket/src
      - ../packages/typescript-config:/app/packages/typescript-config

  localstack:
    container_name: zyronode-localstack
    image: localstack/localstack
    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      - '127.0.0.1:4510-4559:4510-4559' # external services port range
      - '127.0.0.1:443:443' # LocalStack HTTPS Gateway
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-../volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'

      
volumes:
  postgres_data:
  redis_data: