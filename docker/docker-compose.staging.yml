# Staging stack (same release images as production). Run via `pnpm docker:staging:*` (passes --env-file env/.env.staging).
# Paths are relative to this file (docker/).
name: zyronode-staging

services:
  redis:
    image: redis:7-alpine
    container_name: zyronode-staging-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ..
      dockerfile: apps/server/docker/Dockerfile.production
      args:
        APP_ENV: staging
    container_name: zyronode-staging-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:?SERVER_PORT must be set in env/.env.staging}:${SERVER_PORT:?SERVER_PORT must be set in env/.env.staging}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.SERVER_PORT || '8000') + '/api/v1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    env_file:
      - ../env/.env.staging
    environment:
      # DATABASE_URL comes from env/.env.staging (Supabase pooled URL).
      # It must be set there — no local postgres container in staging.
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in env/.env.staging}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: apps/app/docker/Dockerfile.production
      args:
        APP_ENV: staging
    container_name: zyronode-staging-app
    restart: unless-stopped
    env_file:
      - ../env/.env.staging
    environment:
      # PROXY=false in prod: vite preview has no proxy, the browser calls
      # the absolute VITE_SERVER_URL (baked at build time) directly.
      - PROXY=false
      - APP_PORT=${APP_PORT:?APP_PORT must be set in env/.env.staging}
      - SERVER_PORT=${SERVER_PORT:?SERVER_PORT must be set in env/.env.staging}
    ports:
      - "${APP_PORT:?APP_PORT must be set in env/.env.staging}:${APP_PORT:?APP_PORT must be set in env/.env.staging}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.APP_PORT || '3000') + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      server:
        condition: service_healthy

  chat-widget-test:
    build:
      context: ..
      dockerfile: apps/chat-widget-test/docker/Dockerfile.production
      args:
        APP_ENV: staging
    container_name: zyronode-staging-widget-test
    restart: unless-stopped
    env_file:
      - ../env/.env.staging
    environment:
      - CHAT_WIDGET_PORT=${CHAT_WIDGET_PORT:?CHAT_WIDGET_PORT must be set in env/.env.staging}
      - SERVER_PORT=${SERVER_PORT:?SERVER_PORT must be set in env/.env.staging}
    ports:
      - "${CHAT_WIDGET_PORT:?CHAT_WIDGET_PORT must be set in env/.env.staging}:${CHAT_WIDGET_PORT:?CHAT_WIDGET_PORT must be set in env/.env.staging}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.CHAT_WIDGET_PORT || '4000') + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      server:
        condition: service_healthy

volumes:
  redis_data:
