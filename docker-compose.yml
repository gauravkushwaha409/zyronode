# docker-compose.yml
services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    container_name: server
    command: sh -c "pnpm prisma:generate && pnpm prisma:deploy && pnpm dev:server"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/server/src:/app/apps/server/src
      - ./apps/server/prisma:/app/apps/server/prisma
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/mydb
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/auth/me', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile.dev
    container_name: app
    command: sh -c "pnpm dev:app"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/app/src:/app/apps/app/src
      - ./packages/api-client/src:/app/packages/api-client/src
      - ./packages/react-hook-form/src:/app/packages/react-hook-form/src
      - ./packages/tanstack-react-query/src:/app/packages/tanstack-react-query/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./packages/typescript-config:/app/packages/typescript-config

volumes:
  postgres_data: