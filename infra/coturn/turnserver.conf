# Sample coturn config for local call testing. The server issues short-lived
# credentials via the REST scheme (see TurnService), so this file uses
# `use-auth-secret` + `static-auth-secret` — the secret MUST match TURN_SECRET
# in env/.env.<environment>.
#
# Run locally via the `coturn` service in docker/docker-compose.development.yml.

listening-port=3478
tls-listening-port=5349

# Docker: listen on all interfaces inside the container.
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Realm is informational; the REST username (`<expiry>:<userId>`) carries auth.
realm=zyronode.local

# REST credential scheme — no static user accounts needed.
use-auth-secret
static-auth-secret=change-me-to-a-long-random-secret

# Local testing only. Production needs TLS certs (cert=/pkey=) and a
# restricted allowlist instead of the defaults below.
no-tlsv1
no-tlsv1_1

# Verbose in dev; drop to normal verbosity in production.
verbose

# Connection limits for local testing.
max-bps=104857600
bps-capacity=0
stale-nonce=600
